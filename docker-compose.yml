services:

  app:
    build: .
    image: expense-calculator
    container_name: expense-app
    ports:
      - "8081:8081"
    environment:
      DB_USERNAME: root
      DB_PASSWORD: mypassword
      JWT_SECRET: my-super-secret-key
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: expense-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mypassword
      MYSQL_DATABASE: Nallamasu
    ports:
      - "3307:3306"

    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: expense-redis
    ports:
      - "6380:6379"