spring.application.name=Expense_Calculator
server.port=8081

//DB
spring.datasource.url=jdbc:mysql://localhost:3306/Nallamasu
spring.datasource.username=root
spring.datasource.password=00000000
#spring.datasource.url=jdbc:mysql://mysql:3306/Nallamasu
#spring.datasource.username=${DB_USERNAME}
#spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update

//JWT
jwt.secret=ThisIsMyVerySecretKeyForExpenseManagerApplication123456789
#jwt.secret=${JWT_SECRET}
jwt.access.expiration=21600000
jwt.refresh.expiration=2592000000

//Actuator
management.endpoints.web.exposure.include=health,info,metrics
info.app.name=Expense Calculator
info.app.description=Expense Management Application
info.app.version=1.0.0

//Redis
#spring.data.redis.host=localhost
spring.data.redis.host=redis
spring.data.redis.port=6379


# GEMINI
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent
gemini.api.model=gemini-3.6-flash